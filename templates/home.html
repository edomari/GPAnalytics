<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoGPStats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="home">
    <div class="home-bg" aria-hidden="true"></div>

    <main class="home-stage">
        <p class="home-eyebrow">MotoGPStats // Archivio gare</p>
        <h1 class="home-title">Seleziona<br>il tuo<br><span>Gran Premio</span></h1>

        <form action="/results" method="POST" class="home-form" id="raceForm">

            <div class="lights-rig" id="lightsRig" aria-hidden="true">
                <span class="light" data-light="1"></span>
                <span class="light" data-light="2"></span>
                <span class="light" data-light="3"></span>
                <span class="light" data-light="4"></span>
                <span class="light" data-light="5"></span>
            </div>

            <div class="field-grid" id="fieldGrid">
                <div class="field">
                    <label for="year">Anno</label>
                    <select id="year" name="year" required>
                        <option value="" disabled selected>--</option>
                        {% for year in range(2002, 2027) %}
                            <option value="{{ year }}">{{ year }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="field" id="categoryField" style="display:none">
                    <label for="sessionType">Sessione</label>
                    <select id="sessionType" name="sessionType">
                        <option value="" disabled selected>Seleziona...</option>
                        <option value="RAC">Gara (RAC)</option>
                        <option value="SPR">Sprint (SPR)</option>
                    </select>
                </div>

                <div class="field">
                    <label for="granPrix">Circuito</label>
                    <select id="granPrix" name="granPrix" disabled>
                        <option value="">Seleziona prima l'anno</option>
                    </select>
                </div>
            </div>

            <button class="button-54 lights-out-btn" role="button" type="submit" id="submitBtn" disabled>
                <span class="btn-default">Lights out</span>
                <span class="btn-arrow" aria-hidden="true">&rarr;</span>
            </button>
        </form>
    </main>

    <script>
        const lights = document.querySelectorAll('.light');
        const submitBtn = document.getElementById('submitBtn');
        const yearSelect = document.getElementById('year');
        const gpSelect = document.getElementById('granPrix');
        const categoryField = document.getElementById('categoryField');
        const sessionSelect = document.getElementById('sessionType');
        const form = document.getElementById('raceForm');

        const FIRST_SPRINT_YEAR = 2023;

        function setLight(index, on) {
            if (lights[index]) lights[index].classList.toggle('on', on);
        }

        // Mostra il campo "Sessione" (RAC/SPR) solo per gli anni in cui esiste la Sprint Race
        function setCategoryVisible(visible) {
            categoryField.style.display = visible ? '' : 'none';
            sessionSelect.disabled = !visible;
            sessionSelect.required = visible;
            if (!visible) {
                sessionSelect.value = '';
            }
        }

        function updateLights() {
            const yearReady = !!yearSelect.value;
            const categoryVisible = categoryField.style.display !== 'none';
            const categoryReady = !categoryVisible || !!sessionSelect.value;
            const trackReady = !!gpSelect.value && !gpSelect.disabled;
            const gpReady = yearReady && categoryReady && trackReady;

            setLight(0, yearReady);
            setLight(1, yearReady && categoryReady);
            setLight(2, gpReady);
            setLight(3, gpReady);
            setLight(4, gpReady);

            submitBtn.disabled = !gpReady;
        }

        yearSelect.addEventListener('change', async function() {
            const year = this.value;

            setCategoryVisible(year !== '' && parseInt(year, 10) >= FIRST_SPRINT_YEAR);

            gpSelect.innerHTML = '<option value="">Caricamento tracciati in corso...</option>';
            gpSelect.disabled = true;
            updateLights();

            try {
                // Chiama la nuova API Flask
                const response = await fetch(`/api/tracks/${year}`);
                const tracks = await response.json();

                gpSelect.innerHTML = '';

                if (tracks && tracks.length > 0) {
                    const placeholder = document.createElement('option');
                    placeholder.value = '';
                    placeholder.disabled = true;
                    placeholder.selected = true;
                    placeholder.textContent = "Seleziona il circuito...";
                    gpSelect.appendChild(placeholder);

                    tracks.forEach(track => {
                        const option = document.createElement('option');
                        // Nel tuo backend c'è già il metodo .upper() su granPrix,
                        // quindi va bene usare l'abbreviazione diretta
                        option.value = track;
                        option.textContent = track;
                        gpSelect.appendChild(option);
                    });
                    gpSelect.disabled = false;
                } else {
                    gpSelect.innerHTML = '<option value="">Nessun tracciato trovato</option>';
                }
            } catch (error) {
                console.error("Errore nel recupero dei tracciati:", error);
                gpSelect.innerHTML = '<option value="">Errore di caricamento</option>';
            }
            updateLights();
        });

        sessionSelect.addEventListener('change', updateLights);
        gpSelect.addEventListener('change', updateLights);

        form.addEventListener('submit', function(event) {
            if (submitBtn.disabled) {
                event.preventDefault();
                return;
            }
            // Piccola animazione "lights out" alla partenza prima dell'invio
            event.preventDefault();
            lights.forEach(l => { l.classList.remove('on'); l.classList.add('out'); });
            setTimeout(() => form.submit(), 350);
        });
    </script>
</body>
</html>
