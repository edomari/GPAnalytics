<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoGPStats</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="home">
    <h1>Select year and gran prix</h1>
    <form action="/results" method="POST">
        <label for="year">Year:</label>
        <select id="year" name="year">
            <option value="" disabled selected>Seleziona un anno...</option>
            {% for year in range(2002, 2027) %}
                <option value="{{ year }}">{{ year }}</option>
            {% endfor %}
        </select>

        <label for="granPrix">Gran Prix:</label>
        <select id="granPrix" name="granPrix" disabled>
            <option value="">Seleziona prima l'anno</option>
        </select>

        <button class="button-54" role="button" type="submit">Vai al PDF</button>
    </form>

    <script>
        document.getElementById('year').addEventListener('change', async function() {
            const year = this.value;
            const gpSelect = document.getElementById('granPrix');

            // Disabilita la tendina e mostra lo stato di caricamento
            gpSelect.innerHTML = '<option value="">Caricamento tracciati in corso...</option>';
            gpSelect.disabled = true;

            try {
                // Chiama la nuova API Flask
                const response = await fetch(`/api/tracks/${year}`);
                const tracks = await response.json();

                // Svuota la tendina
                gpSelect.innerHTML = '';

                if (tracks && tracks.length > 0) {
                    // Popola la tendina con i risultati estratti dal PDF
                    tracks.forEach(track => {
                        const option = document.createElement('option');
                        // Nel tuo backend c'è già il metodo .upper() su granPrix,
                        // quindi va bene usare l'abbreviazione diretta
                        option.value = track;
                        option.textContent = track;
                        gpSelect.appendChild(option);
                    });
                    // Riabilita la tendina
                    gpSelect.disabled = false;
                } else {
                    gpSelect.innerHTML = '<option value="">Nessun tracciato trovato</option>';
                }
            } catch (error) {
                console.error("Errore nel recupero dei tracciati:", error);
                gpSelect.innerHTML = '<option value="">Errore di caricamento</option>';
            }
        });
    </script>
</body>
</html>
